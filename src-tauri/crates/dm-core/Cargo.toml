[package]
name = "dm-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for DeskMedic: disk scan, cleanup, disk tools and fix-its. No Tauri deps, testable on its own."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ntfs = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
