[package]
name = "deskmedic"
version = "0.1.1"
description = "Windows helpdesk disk utility"
license = "MIT"
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "deskmedic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dm-core = { path = "crates/dm-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace]
members = ["crates/dm-core"]
resolver = "2"

# Keep debug builds small: line numbers for our own panics, no debug info
# for dependencies (it made target/ grow past 10 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
