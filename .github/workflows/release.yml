name: Release

# Push a tag like v0.1.0: builds the portable exe, attaches it with its
# SHA-256 to a draft release, then publishes the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Engine tests
        working-directory: src-tauri
        run: cargo test -p dm-core

      - name: Build the portable exe
        run: npm run tauri build -- --no-bundle

      - name: Name it and hash it
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $exe = "DeskMedic-$v.exe"
          Copy-Item src-tauri/target/release/deskmedic.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File -Encoding ascii "$exe.sha256"
          "EXE=$exe" >> $env:GITHUB_ENV
          "HASH=$hash" >> $env:GITHUB_ENV

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "Portable exe for Windows 10/11 (needs the WebView2 runtime). Not code-signed yet: SmartScreen asks once (More info, Run anyway).`n`nSHA-256: ``$env:HASH``"
          gh release create "${{ github.ref_name }}" $env:EXE "$env:EXE.sha256" --title "DeskMedic ${{ github.ref_name }}" --notes $notes --draft
          gh release edit "${{ github.ref_name }}" --draft=false
