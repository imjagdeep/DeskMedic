name: Test build

# Run by hand (Actions tab or `gh workflow run test-build.yml --ref <branch>`):
# builds the installer and the portable exe from a branch and keeps them as a
# run artifact for a few days, so a change can be tried on a real PC before
# a release. Nothing is published.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the exe and the installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: deskmedic-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/deskmedic.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 5
